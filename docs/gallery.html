<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图表画廊 · 中国制博会调研</title>
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap:20px; }
  .gallery .item { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,0.04); transition: transform .2s; }
  .gallery .item:hover { transform: translateY(-3px); box-shadow:0 8px 24px rgba(15,23,42,0.08); }
  .gallery .item img { width:100%; display:block; background:#f8fafc; }
  .gallery .item .meta { padding:14px 16px; }
  .gallery .item .meta h3 { margin:0 0 4px; font-size:16px; }
  .gallery .item .meta p { margin:0; color:var(--muted); font-size:13px; }
  .gallery .item .actions { padding:0 16px 16px; }
  .gallery .item .actions a { font-size:12px; color:var(--primary); margin-right:10px; }
</style>
</head>
<body>

<div class="container">

  <section class="section">
    <span class="tag">图表画廊</span>
    <h2 style="margin-top:8px;">20 张可视化图表合集</h2>
    <div class="lead">所有图表与 word 报告同源，1600×1000 高清 PNG，可直接下载用于答辩、海报与幻灯片。</div>
  </section>

  <section class="section">
    <div class="gallery" id="gallery"></div>
  </section>

</div>

<script src="assets/js/common.js"></script>
<script>
  const items = [
    { id: 'F1',  title: '图F1 · 规模演进信息图',          desc: '面积/企业/意向成交三十年趋势' },
    { id: 'F2',  title: '图F2 · 12 个专业展区构成',        desc: '玫瑰图，按主题与产业链定位划分' },
    { id: 'F3',  title: '图F3 · 发展五大成效评分',         desc: '横向条形 + 五维评分' },
    { id: 'F4',  title: '图F4 · 发展时间脉络',             desc: '面积+企业双轴时序图' },
    { id: 'F5',  title: '图F5 · 九大问题优先级雷达',       desc: '影响×紧迫性双维评估' },
    { id: 'F6',  title: '图F6 · 问题—建议桑基图',          desc: '9 类问题映射 11 项建议' },
    { id: 'F7',  title: '图F7 · 影响×可行性矩阵',          desc: '建议优先级散点图' },
    { id: 'F8',  title: '图F8 · 数字化三阶段闭环',         desc: '展前-展中-展后旭日图' },
    { id: 'F9',  title: '图F9 · 五阶段实施甘特图',         desc: '单届筹办周期可视化' },
    { id: 'F10', title: '图F10 · 评估指标体系树',          desc: '6 类×20 余项指标' },
    { id: 'F11', title: '图F11 · 价值主张四象限',          desc: '对参展商/观众/政府/高校/公众' },
    { id: 'F12', title: '图F12 · 传播渠道适配热力图',      desc: '受众×渠道匹配度' },
    { id: 'F13', title: '图F13 · 沈阳产业链辐射网络',      desc: '中国制造业重点区域辐射' },
    { id: 'F14', title: '图F14 · SWOT 战略分析',           desc: '优势/劣势/机会/威胁四象限' },
    { id: 'F15', title: '图F15 · 同类展会对比',            desc: 'vs CIIF / CIMT / CHTF' },
    { id: 'F16', title: '图F16 · 调研方法论流程',          desc: '六阶段定量+定性' },
    { id: 'F17', title: '图F17 · 经济乘数效应分解',        desc: '直接/间接/诱发树图' },
    { id: 'F18', title: '图F18 · 满意度模拟分布',          desc: '示例堆叠条形图' },
    { id: 'F19', title: '图F19 · 核心 KPI 仪表盘',         desc: '六个关键指标当前值/目标值' },
    { id: 'F20', title: '图F20 · 工业文旅联动路线',        desc: '展馆-工厂-高校-文化场所' },
  ];
  const g = document.getElementById('gallery');
  g.innerHTML = items.map(it => `
    <div class="item">
      <a href="charts/chart.html?id=${it.id}" target="_blank">
        <img src="assets/img/${it.id}.png" alt="${it.title}" loading="lazy">
      </a>
      <div class="meta">
        <h3>${it.title}</h3>
        <p>${it.desc}</p>
      </div>
      <div class="actions">
        <a href="assets/img/${it.id}.png" download>下载 PNG</a>
        <a href="charts/chart.html?id=${it.id}" target="_blank">交互查看</a>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
