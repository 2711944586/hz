<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>图表导出页</title>
<link rel="stylesheet" href="../assets/css/style.css?v=2026060502" />
<script src="../assets/js/echarts.min.js?v=2026060502"></script>
<style>
  body { background: #fff; }
  .chart-only .chart { width: 1400px; height: 880px; }
</style>
</head>
<body>
<div class="chart-only">
  <div id="chart" class="chart"></div>
</div>
<script src="../assets/js/charts.js?v=2026060502"></script>
<script>
  const code = new URLSearchParams(location.search).get('id') || 'F2';
  const dom = document.getElementById('chart');
  if (!window.echarts || !window.CHART_BUILDERS || typeof window.CHART_BUILDERS[code] !== 'function') {
    dom.innerHTML = '<div class="chart-error">图表加载失败，请返回图表画廊重新选择。</div>';
  } else {
    const chart = echarts.init(dom, null, { renderer: 'canvas' });
    chart.setOption(window.CHART_BUILDERS[code]());
  }
  window.__chart_ready__ = true;
</script>
</body>
</html>
