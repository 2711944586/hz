<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;width:1280px;height:800px;overflow:hidden;}svg{display:block;}</style></head><body><?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1E40AF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F1F4F" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="spot" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.5)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#g)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#spot)"/>

  <!-- 大图标 -->
  <g transform="translate(540,200)"><g transform="translate(100,100)"><circle r="35" fill="rgba(255,255,255,0.18)"/><circle r="14" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/><g><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(45)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(90)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(135)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(180)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(225)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(270)"/><rect x="-3" y="-46" width="6" height="14" fill="rgba(255,255,255,0.6)" transform="rotate(315)"/></g></g></g>

  <!-- 标签 -->
  <rect x="60" y="60" width="160" height="36" rx="18" fill="rgba(255,255,255,0.95)"/>
  <text x="140" y="84" text-anchor="middle"
        font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="16" font-weight="700" fill="#1E40AF">机床</text>

  <!-- 主标题 -->
  <text x="640" y="480" text-anchor="middle"
        font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="56" font-weight="800" fill="rgba(255,255,255,0.98)"
        letter-spacing="3">工业母机展区</text>

  <!-- 英文副标题 -->
  <text x="640" y="530" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="20" fill="rgba(255,255,255,0.7)"
        letter-spacing="2">Machine Tool Zone</text>

  <!-- 角标 -->
  <text x="1220" y="740" text-anchor="end"
        font-family="Helvetica, sans-serif"
        font-size="14" fill="rgba(255,255,255,0.45)">CIEME · 2025 · SHENYANG</text>
  <text x="60" y="740"
        font-family="Helvetica, sans-serif"
        font-size="14" fill="rgba(255,255,255,0.45)">PHOTO PLACEHOLDER · 待替换为现场实拍</text>

  <!-- 装饰 dots -->
  <g fill="rgba(245,158,11,0.7)">
    <circle cx="1220" cy="80" r="4"/>
    <circle cx="1200" cy="80" r="4"/>
    <circle cx="1180" cy="80" r="4"/>
  </g>
</svg></body></html>
